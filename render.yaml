# Render blueprint — free tier to start with.
#
# One web service serves the API and the built frontend, so the browser talks
# to a single origin and the session cookie stays first-party. The generation
# worker runs inside that same service (render-start.sh), because Render has no
# free background worker.
#
# WHEN YOU UPGRADE (do this before the database's 30th day — see the README):
#   1. Database: change `plan: free` to `plan: 0.1c-256mb`. Upgrading in place
#      keeps the data; there is also a 14-day grace period after expiry.
#   2. Web: change `plan: free` to `plan: starter` so it stops sleeping.
#   3. Worker: uncomment the service at the bottom and change the web service's
#      startCommand to the gunicorn line from render-start.sh.

databases:
  - name: qa-agent-db
    databaseName: qa_agent
    user: qa_agent
    # Free databases: 1 GB, no backups, and they EXPIRE 30 DAYS AFTER CREATION.
    # `python manage.py backup_db --json` is the only safety net until this is
    # on a paid plan.
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: qa-agent
    runtime: python
    plan: free # Sleeps after 15 minutes idle; ~1 minute to wake.
    region: oregon
    branch: main
    buildCommand: bash ./render-build.sh
    startCommand: bash ./render-start.sh
    healthCheckPath: /api/auth/options/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "22.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: qa-agent-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates one; it never touches git.
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false # generate_encryption_key. Keep a copy — losing it means reconnecting.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false # Resend's HTTPS API. Free Render instances block SMTP ports.
      - key: DEFAULT_FROM_EMAIL
        sync: false # A sender Resend has verified, e.g. QA Agent <qa@yourdomain.com>
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false # Who may sign in. Empty means anyone who finds the URL.
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1" # The Render hostname is added automatically.
      - key: TRUST_PROXY_SSL_HEADER
        value: "true" # Render terminates TLS in front of the app.
      - key: LLM_MODEL
        value: claude-opus-5
      - key: LLM_EFFORT
        value: high
      - key: RUN_COST_CAP_USD
        value: "1.00"
      - key: WORKSPACE_MONTHLY_CAP_USD
        value: "50"
