# Render blueprint: one web service, one worker, one database.
#
# The web service serves the API *and* the built frontend, so the browser only
# ever talks to one origin and the session cookie stays first-party.
#
# The worker is separate because generation takes minutes: a request-scoped
# process would be killed long before a run finishes. To save $7/month you can
# delete the worker service and append `&& python manage.py db_worker &` to the
# web start command — runs then only progress while the web service is awake,
# which is a real trade, not a free one.

databases:
  - name: qa-agent-db
    databaseName: qa_agent
    user: qa_agent
    plan: basic-256mb # Free databases expire 30 days after creation.
    postgresMajorVersion: "17"

services:
  - type: web
    name: qa-agent
    runtime: python
    plan: starter # Free instances sleep after 15 minutes; runs stall when they do.
    region: oregon
    branch: main
    buildCommand: ./render-build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/auth/options/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: qa-agent-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates one and keeps it out of git.
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false # Paste your own: generate_encryption_key. Losing it means reconnecting.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_URL
        sync: false # Resend: smtp://resend:<api-key>@smtp.resend.com:587/?tls=True
      - key: DEFAULT_FROM_EMAIL
        sync: false # e.g. QA Agent <qa-agent@yourdomain.com> — must be a verified sender.
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false # Who may sign in. Empty means anybody who can reach the URL.
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1" # The Render hostname is added automatically.
      - key: TRUST_PROXY_SSL_HEADER
        value: "true" # Render terminates TLS in front of the app.
      - key: LLM_MODEL
        value: claude-opus-5
      - key: LLM_EFFORT
        value: high
      - key: RUN_COST_CAP_USD
        value: "1.00"
      - key: WORKSPACE_MONTHLY_CAP_USD
        value: "50"

  - type: worker
    name: qa-agent-worker
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: ./render-build.sh --backend-only
    # Anything left running by a previous deploy is failed before we start, so
    # no run sits at "running" forever after a restart.
    startCommand: cd backend && python manage.py reap_runs && python manage.py db_worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: qa-agent-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      # Must match the web service, or sessions and stored credentials break.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: qa-agent
          envVarKey: DJANGO_SECRET_KEY
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: TRUST_PROXY_SSL_HEADER
        value: "true"
      - key: LLM_MODEL
        value: claude-opus-5
      - key: LLM_EFFORT
        value: high
      - key: RUN_COST_CAP_USD
        value: "1.00"
      - key: WORKSPACE_MONTHLY_CAP_USD
        value: "50"
